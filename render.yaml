services:
  - type: web
    name: movie-sentiment-analyzer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_PATH
        value: outputs/paper_regime/best_model.joblib
